# .github/workflows/jev-review.yml
name: Jev review

on:
  # pull_request_target runs with the base branch's workflow and secrets. This is safe here
  # because the action never checks out or runs PR code: the diff comes from the API and the
  # config is read from the base commit. Do NOT add actions/checkout of the PR head to this job.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  # checks: write   # only with output.check_run: true

concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: your-org/jev-code-review@v1
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          # allow-fork-prs: true   # sends fork code to TypeSafe and lets forks trigger paid runs
