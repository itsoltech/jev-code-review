name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point the major tag (v1) at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push origin "refs/tags/$major" --force
